{% extends "base.html" %}
{% block title %}个人资料{% endblock %}
{% block content %}
<div id="page-content" class="flex-1 flex flex-col overflow-hidden">
    <style>
        .profile-page {
            flex: 1;
            overflow-y: auto;
            background: var(--color-background);
            padding: 28px;
        }

        .profile-shell {
            width: min(100%, 720px);
            margin: 0 auto;
        }

        .profile-heading {
            margin-bottom: 18px;
        }

        .profile-heading h1 {
            color: var(--color-on-surface);
            font-size: 30px;
            line-height: 1.2;
            font-weight: 700;
            margin: 0;
        }

        .profile-heading p {
            color: var(--color-secondary);
            font-size: 14px;
            margin: 6px 0 0;
        }

        .profile-form {
            display: grid;
            gap: 14px;
        }

        .profile-panel {
            background: var(--color-surface-container-lowest);
            border: 1px solid var(--color-outline-variant);
            border-radius: 10px;
            box-shadow: 0 1px 2px rgba(19, 27, 46, 0.05);
            padding: 20px;
        }

        .profile-identity {
            display: grid;
            grid-template-columns: 96px minmax(0, 1fr);
            align-items: center;
            gap: 18px;
        }

        .profile-avatar-button {
            position: relative;
            width: 96px;
            height: 96px;
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid var(--color-outline-variant);
            background: var(--color-primary-container);
            color: var(--color-on-primary);
            cursor: pointer;
            padding: 0;
        }

        .profile-avatar-button:focus-visible {
            outline: 3px solid var(--color-primary-fixed-dim);
            outline-offset: 3px;
        }

        .profile-avatar-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 700;
        }

        .profile-avatar-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .profile-avatar-image.is-hidden,
        .profile-avatar-fallback.is-hidden {
            display: none;
        }

        .profile-avatar-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(19, 27, 46, 0);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            opacity: 0;
            transition: background 160ms ease, opacity 160ms ease;
        }

        .profile-avatar-button:hover .profile-avatar-overlay,
        .profile-avatar-button:focus-visible .profile-avatar-overlay {
            background: rgba(19, 27, 46, 0.42);
            opacity: 1;
        }

        .profile-panel-title {
            color: var(--color-on-surface);
            font-size: 18px;
            font-weight: 650;
            margin: 0 0 16px;
        }

        .profile-field {
            display: grid;
            gap: 7px;
        }

        .profile-field + .profile-field {
            margin-top: 14px;
        }

        .profile-field label {
            color: var(--color-on-surface-variant);
            font-size: 12px;
            font-weight: 700;
        }

        .profile-field input {
            width: 100%;
            min-height: 46px;
            border-radius: 8px;
            border: 1px solid var(--color-outline);
            background: var(--color-surface);
            color: var(--color-on-surface);
            font-size: 15px;
            padding: 10px 12px;
        }

        .profile-field input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(53, 37, 205, 0.14);
        }

        .profile-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 18px;
        }

        .profile-save-button {
            min-width: 96px;
            min-height: 44px;
            border: 0;
            border-radius: 8px;
            background: var(--color-primary);
            color: var(--color-on-primary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            padding: 10px 18px;
            transition: background 160ms ease, opacity 160ms ease;
        }

        .profile-save-button:hover {
            background: var(--color-primary-fixed-variant);
        }

        .profile-save-button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        @media (max-width: 640px) {
            .profile-page {
                padding: 18px;
            }

            .profile-identity {
                grid-template-columns: 1fr;
                justify-items: start;
            }

            .profile-panel {
                padding: 16px;
            }
        }
    </style>

    <div class="profile-page">
        <div class="profile-shell">
            <header class="profile-heading">
                <h1>个人资料</h1>
                <p>管理你的账号信息</p>
            </header>

            <form id="profile-form" class="profile-form">
                <section class="profile-panel">
                    <div class="profile-identity">
                        <div>
                            <button type="button" id="avatar-trigger" class="profile-avatar-button" aria-label="修改头像">
                                {% if profile.avatar_base64.is_empty() %}
                                <div id="profile-avatar-fallback" class="profile-avatar-fallback">{{ profile.avatar_initial }}</div>
                                <img id="profile-avatar-image" src="" alt="{{ profile.username }}" class="profile-avatar-image is-hidden">
                                {% else %}
                                <div id="profile-avatar-fallback" class="profile-avatar-fallback is-hidden">{{ profile.avatar_initial }}</div>
                                <img id="profile-avatar-image" src="data:image/jpeg;base64,{{ profile.avatar_base64 }}" alt="{{ profile.username }}" class="profile-avatar-image">
                                {% endif %}
                                <span class="profile-avatar-overlay">修改头像</span>
                            </button>
                            <input id="avatar-input" type="file" accept="image/*" hidden>
                        </div>
                        <div class="profile-field">
                            <label for="profile-username-input">用户名</label>
                            <input id="profile-username-input" type="text" name="username" value="{{ profile.username }}" autocomplete="username" required>
                        </div>
                    </div>
                </section>

                <section class="profile-panel">
                    <h2 class="profile-panel-title">修改密码</h2>
                    <div class="profile-field">
                        <label for="profile-current-password">当前密码</label>
                        <input id="profile-current-password" type="password" name="current_password" autocomplete="current-password">
                    </div>
                    <div class="profile-field">
                        <label for="profile-new-password">新密码</label>
                        <input id="profile-new-password" type="password" name="new_password" autocomplete="new-password">
                    </div>
                    <div class="profile-field">
                        <label for="profile-confirm-password">确认新密码</label>
                        <input id="profile-confirm-password" type="password" name="confirm_password" autocomplete="new-password">
                    </div>
                    <div class="profile-actions">
                        <button type="submit" id="profile-save-btn" class="profile-save-button">保存</button>
                    </div>
                </section>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    (function() {
        const avatarTrigger = document.getElementById('avatar-trigger');
        const avatarInput = document.getElementById('avatar-input');
        const avatarImage = document.getElementById('profile-avatar-image');
        const avatarFallback = document.getElementById('profile-avatar-fallback');
        const profileForm = document.getElementById('profile-form');
        const saveButton = document.getElementById('profile-save-btn');
        const usernameInput = document.getElementById('profile-username-input');

        if (avatarTrigger && avatarInput) {
            avatarTrigger.addEventListener('click', () => avatarInput.click());
            avatarInput.addEventListener('change', async event => {
                const [file] = event.target.files || [];
                if (!file) return;

                try {
                    const base64 = await compressAvatar(file);
                    await saveAvatar(base64);
                    setAvatarPreview(base64);
                    if (window.refreshCurrentUserSummary) {
                        await window.refreshCurrentUserSummary();
                    }
                    window.showToast('头像已更新', 'success');
                } catch (error) {
                    window.showToast(error.message || '头像更新失败', 'danger');
                } finally {
                    avatarInput.value = '';
                }
            });
        }

        if (profileForm) {
            profileForm.addEventListener('submit', async event => {
                event.preventDefault();
                const form = new FormData(profileForm);
                const newPassword = (form.get('new_password') || '').toString();
                const confirmPassword = (form.get('confirm_password') || '').toString();
                if (newPassword !== confirmPassword) {
                    window.showToast('两次输入的新密码不一致', 'danger');
                    return;
                }

                saveButton.disabled = true;
                saveButton.classList.add('opacity-50', 'cursor-not-allowed');

                try {
                    const body = new URLSearchParams();
                    for (const [key, value] of form.entries()) {
                        body.set(key, value.toString());
                    }

                    const res = await fetch('/users/profile', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'Accept': 'application/json'
                        },
                        body
                    });
                    const data = await res.json();
                    if (!res.ok || !data.ok) {
                        throw new Error(data.message || '保存失败');
                    }

                    usernameInput.value = data.username;
                    profileForm.querySelector('input[name="current_password"]').value = '';
                    profileForm.querySelector('input[name="new_password"]').value = '';
                    profileForm.querySelector('input[name="confirm_password"]').value = '';
                    if (window.refreshCurrentUserSummary) {
                        await window.refreshCurrentUserSummary();
                    }
                    window.showToast(data.message || '账户信息已保存', 'success');
                } catch (error) {
                    window.showToast(error.message || '保存失败', 'danger');
                } finally {
                    saveButton.disabled = false;
                    saveButton.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            });
        }

        function setAvatarPreview(base64) {
            if (!avatarImage || !avatarFallback) return;
            avatarImage.src = `data:image/jpeg;base64,${base64}`;
            avatarImage.classList.remove('is-hidden');
            avatarFallback.classList.add('is-hidden');
        }

        async function saveAvatar(base64) {
            const res = await fetch('/users/avatar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ avatar_base64: base64 })
            });
            const data = await res.json();
            if (!res.ok || !data.ok) {
                throw new Error(data.message || '保存头像失败');
            }
        }

        function compressAvatar(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('读取图片失败'));
                reader.onload = () => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('图片格式不支持'));
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxSide = 256;
                        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                        canvas.width = Math.max(1, Math.round(img.width * scale));
                        canvas.height = Math.max(1, Math.round(img.height * scale));
                        const ctx = canvas.getContext('2d');
                        if (!ctx) {
                            reject(new Error('浏览器不支持图片压缩'));
                            return;
                        }
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
                        const [, base64] = dataUrl.split(',', 2);
                        if (!base64) {
                            reject(new Error('头像压缩失败'));
                            return;
                        }
                        resolve(base64);
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }
    })();
</script>
{% endblock %}
