{% extends "base.html" %}
{% block title %}用户管理{% endblock %}
{% block content %}
<div id="page-content" class="flex-1 flex flex-col overflow-hidden">
<div class="flex-1 overflow-y-auto p-4 md:p-6 bg-background">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <div>
            <h1 class="text-[30px] font-bold text-on-surface leading-tight tracking-tight">用户管理</h1>
            <p class="text-sm text-muted-text mt-1">管理系统用户和权限</p>
        </div>
        <button onclick="document.getElementById('create-user-dialog').showModal()"
            class="bg-primary hover:bg-primary-fixed-variant text-on-primary text-sm font-semibold px-4 py-2 rounded-lg transition-colors flex items-center justify-center gap-1.5 shadow-sm whitespace-nowrap active:scale-95 duration-100">
            <i data-lucide="plus" class="w-4 h-4"></i>
            添加用户
        </button>
    </div>

    <div id="user-list" class="space-y-3">
        {% include "fragments/user_list.html" %}
    </div>
</div>

<dialog id="create-user-dialog" class="rounded-xl p-0 w-full max-w-md backdrop:bg-black/30 border border-border shadow-lg">
    <div class="bg-surface-container-lowest rounded-xl">
        <div class="px-6 py-4 border-b border-border">
            <h2 class="text-lg font-bold text-on-surface">添加用户</h2>
        </div>
        <form hx-post="/users" hx-target="#user-list" hx-swap="innerHTML" hx-on::after-request="this.reset(); this.closest('dialog').close(); lucide.createIcons();" class="p-6 space-y-4">
            <div>
                <label class="block text-[11px] font-bold text-on-surface-variant mb-2 uppercase tracking-wide">用户名</label>
                <input type="text" name="username" required
                    class="w-full bg-surface border border-outline text-on-surface text-sm rounded px-3 py-2.5 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
            </div>
            <div>
                <label class="block text-[11px] font-bold text-on-surface-variant mb-2 uppercase tracking-wide">密码</label>
                <input type="password" name="password" required
                    class="w-full bg-surface border border-outline text-on-surface text-sm rounded px-3 py-2.5 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
            </div>
            <div>
                <label class="block text-[11px] font-bold text-on-surface-variant mb-2 uppercase tracking-wide">角色</label>
                <select name="role" class="w-full bg-surface border border-outline text-on-surface text-sm rounded px-3 py-2.5 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
                    <option value="user">普通用户</option>
                    <option value="admin">管理员</option>
                </select>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="this.closest('dialog').close()"
                    class="px-4 py-2 text-sm border border-outline-variant rounded-lg text-secondary hover:bg-surface-container-low transition-colors">取消</button>
                <button type="submit"
                    class="px-4 py-2 bg-primary hover:bg-primary-fixed-variant text-on-primary text-sm font-semibold rounded-lg transition-colors shadow-sm">创建</button>
            </div>
        </form>
    </div>
</dialog>
</div>
{% endblock %}
