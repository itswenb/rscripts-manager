{% extends "base.html" %}
{% block title %}个人资料{% endblock %}
{% block content %}
<div id="page-content" class="flex-1 flex flex-col overflow-hidden">
    <style>
        .profile-page {
            flex: 1;
            overflow-y: auto;
            background: var(--color-background);
            padding: 28px;
        }

        .profile-shell {
            width: min(100%, 720px);
            margin: 0 auto;
        }

        .profile-heading {
            margin-bottom: 18px;
        }

        .profile-heading h1 {
            color: var(--color-on-surface);
            font-size: 30px;
            line-height: 1.2;
            font-weight: 700;
            margin: 0;
        }

        .profile-heading p {
            color: var(--color-secondary);
            font-size: 14px;
            margin: 6px 0 0;
        }

        .profile-form {
            display: grid;
            gap: 14px;
        }

        .profile-panel {
            background: var(--color-surface-container-lowest);
            border: 1px solid var(--color-outline-variant);
            border-radius: 10px;
            box-shadow: 0 1px 2px rgba(19, 27, 46, 0.05);
            padding: 20px;
        }

        .profile-identity {
            display: grid;
            grid-template-columns: 96px minmax(0, 1fr);
            align-items: center;
            gap: 18px;
        }

        .profile-avatar-button {
            position: relative;
            width: 96px;
            height: 96px;
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid var(--color-outline-variant);
            background: var(--color-primary-container);
            color: var(--color-on-primary);
            cursor: pointer;
            padding: 0;
        }

        .profile-avatar-button:focus-visible {
            outline: 3px solid var(--color-primary-fixed-dim);
            outline-offset: 3px;
        }

        .profile-avatar-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 700;
        }

        .profile-avatar-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .profile-avatar-image.is-hidden,
        .profile-avatar-fallback.is-hidden {
            display: none;
        }

        .profile-avatar-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(19, 27, 46, 0);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            opacity: 0;
            transition: background 160ms ease, opacity 160ms ease;
        }

        .profile-avatar-button:hover .profile-avatar-overlay,
        .profile-avatar-button:focus-visible .profile-avatar-overlay {
            background: rgba(19, 27, 46, 0.42);
            opacity: 1;
        }

        .profile-panel-title {
            color: var(--color-on-surface);
            font-size: 18px;
            font-weight: 650;
            margin: 0 0 16px;
        }

        .profile-field {
            display: grid;
            gap: 7px;
        }

        .profile-field + .profile-field {
            margin-top: 14px;
        }

        .profile-field label {
            color: var(--color-on-surface-variant);
            font-size: 12px;
            font-weight: 700;
        }

        .profile-field input {
            width: 100%;
            min-height: 46px;
            border-radius: 8px;
            border: 1px solid var(--color-outline);
            background: var(--color-surface);
            color: var(--color-on-surface);
            font-size: 15px;
            padding: 10px 12px;
        }

        .profile-field input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(53, 37, 205, 0.14);
        }

        .profile-field input.is-invalid {
            border-color: var(--color-danger, #d64545);
            box-shadow: 0 0 0 3px rgba(214, 69, 69, 0.14);
        }

        .profile-field input.is-valid {
            border-color: var(--color-success, #2f8f4e);
            box-shadow: 0 0 0 3px rgba(47, 143, 78, 0.14);
        }

        .profile-feedback {
            min-height: 18px;
            font-size: 12px;
            line-height: 1.4;
        }

        .profile-feedback.is-error {
            color: var(--color-danger, #d64545);
        }

        .profile-feedback.is-success {
            color: var(--color-success, #2f8f4e);
        }

        .profile-status {
            display: none;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        .profile-status.is-visible {
            display: block;
        }

        .profile-status.is-error {
            background: rgba(214, 69, 69, 0.1);
            border: 1px solid rgba(214, 69, 69, 0.2);
            color: var(--color-danger, #d64545);
        }

        .profile-status.is-success {
            background: rgba(47, 143, 78, 0.1);
            border: 1px solid rgba(47, 143, 78, 0.2);
            color: var(--color-success, #2f8f4e);
        }

        .profile-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 18px;
        }

        .profile-save-button {
            min-width: 96px;
            min-height: 44px;
            border: 0;
            border-radius: 8px;
            background: var(--color-primary);
            color: var(--color-on-primary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            padding: 10px 18px;
            transition: background 160ms ease, opacity 160ms ease;
        }

        .profile-save-button:hover {
            background: var(--color-primary-fixed-variant);
        }

        .profile-save-button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        @media (max-width: 640px) {
            .profile-page {
                padding: 18px;
            }

            .profile-identity {
                grid-template-columns: 1fr;
                justify-items: start;
            }

            .profile-panel {
                padding: 16px;
            }
        }
    </style>

    <div class="profile-page">
        <div class="profile-shell">
            <header class="profile-heading">
                <h1>个人资料</h1>
                <p>管理你的账号信息</p>
            </header>

            <form id="profile-form" class="profile-form">
                <section class="profile-panel">
                    <div class="profile-identity">
                        <div>
                            <button type="button" id="avatar-trigger" class="profile-avatar-button" aria-label="修改头像">
                                {% if profile.avatar_base64.is_empty() %}
                                <div id="profile-avatar-fallback" class="profile-avatar-fallback">{{ profile.avatar_initial }}</div>
                                <img id="profile-avatar-image" src="" alt="{{ profile.username }}" class="profile-avatar-image is-hidden">
                                {% else %}
                                <div id="profile-avatar-fallback" class="profile-avatar-fallback is-hidden">{{ profile.avatar_initial }}</div>
                                <img id="profile-avatar-image" src="data:image/jpeg;base64,{{ profile.avatar_base64 }}" alt="{{ profile.username }}" class="profile-avatar-image">
                                {% endif %}
                                <span class="profile-avatar-overlay">修改头像</span>
                            </button>
                            <input id="avatar-input" type="file" accept="image/*" hidden>
                        </div>
                        <div class="profile-field">
                            <label for="profile-username-input">用户名</label>
                            <input id="profile-username-input" type="text" name="username" value="{{ profile.username }}" autocomplete="username" required>
                            <p id="profile-username-feedback" class="profile-feedback" aria-live="polite"></p>
                        </div>
                    </div>
                    <div id="avatar-status" class="profile-status" aria-live="polite"></div>
                </section>

                <section class="profile-panel">
                    <h2 class="profile-panel-title">修改密码</h2>
                    <div id="profile-status" class="profile-status" aria-live="polite"></div>
                    <div class="profile-field">
                        <label for="profile-current-password">当前密码</label>
                        <input id="profile-current-password" type="password" name="current_password" autocomplete="current-password">
                        <p id="profile-current-password-feedback" class="profile-feedback" aria-live="polite"></p>
                    </div>
                    <div class="profile-field">
                        <label for="profile-new-password">新密码</label>
                        <input id="profile-new-password" type="password" name="new_password" autocomplete="new-password">
                        <p id="profile-new-password-feedback" class="profile-feedback" aria-live="polite"></p>
                    </div>
                    <div class="profile-field">
                        <label for="profile-confirm-password">确认新密码</label>
                        <input id="profile-confirm-password" type="password" name="confirm_password" autocomplete="new-password">
                        <p id="profile-confirm-password-feedback" class="profile-feedback" aria-live="polite"></p>
                    </div>
                    <div class="profile-actions">
                        <button type="submit" id="profile-save-btn" class="profile-save-button">保存</button>
                    </div>
                </section>
            </form>
        </div>
    </div>
</div>
{% endblock %}
