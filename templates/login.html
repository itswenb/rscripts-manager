<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ripeline - 登录</title>
    <link rel="stylesheet" href="/static/style.css?v=20260520-terminal" />
  </head>
  <body class="min-h-screen flex items-center justify-center bg-background">
    <div
      class="w-full max-w-sm p-8 bg-surface-container-lowest border border-border rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.05)]"
    >
      <div class="flex items-center justify-center gap-2 mb-8">
        <div
          class="w-10 h-10 rounded-lg bg-primary-container flex items-center justify-center text-on-primary-container"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5"
            />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-on-surface">ripeline</h1>
      </div>
      <form method="POST" action="/login" class="space-y-4">
        <div>
          <label
            class="block text-[11px] font-bold text-on-surface-variant mb-2 uppercase tracking-wide"
            >用户名</label
          >
          <input
            type="text"
            name="username"
            required
            class="w-full bg-surface border border-outline text-on-surface text-sm rounded px-3 py-2.5 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
          />
        </div>
        <div>
          <label
            class="block text-[11px] font-bold text-on-surface-variant mb-2 uppercase tracking-wide"
            >密码</label
          >
          <input
            type="password"
            name="password"
            required
            class="w-full bg-surface border border-outline text-on-surface text-sm rounded px-3 py-2.5 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-primary hover:bg-primary-fixed-variant text-on-primary text-sm font-semibold rounded-lg py-2.5 px-4 transition-colors shadow-sm active:scale-95 duration-100"
        >
          登录
        </button>
      </form>
    </div>
  </body>
</html>
