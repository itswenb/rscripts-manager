<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFlow - {% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css?v=20260520-terminal">
    <script src="/static/vendor/htmx.min.js"></script>
    <script src="/static/vendor/lucide.min.js"></script>
</head>
<body class="h-screen overflow-hidden">
    <div class="flex h-screen w-full bg-background text-on-background overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
        <!-- Sidebar -->
        <nav class="hidden md:flex flex-col w-64 h-screen sticky left-0 top-0 py-4 bg-surface-container-lowest border-r border-outline-variant shrink-0 z-40">
            <div class="px-4 mb-4">
                <div class="flex items-center gap-2 mb-2">
                    <div class="w-8 h-8 rounded bg-primary-container flex items-center justify-center text-on-primary-container">
                        <i data-lucide="flask-conical" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-semibold text-on-surface leading-tight">RFlow</h1>
                        <div class="font-mono text-xs text-muted-text">v0.1.0</div>
                    </div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto px-2 space-y-1">
                <a hx-get="/projects" hx-target="#main-content" hx-select="#page-content" hx-swap="innerHTML" hx-push-url="true" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm transition-colors cursor-pointer {% if active_nav == "projects" %}bg-secondary-container text-on-secondary-container font-semibold{% else %}text-secondary hover:bg-surface-container-high{% endif %}">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span>项目</span>
                </a>
                <a hx-get="/pipelines" hx-target="#main-content" hx-select="#page-content" hx-swap="innerHTML" hx-push-url="true" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm transition-colors cursor-pointer {% if active_nav == "pipelines" %}bg-secondary-container text-on-secondary-container font-semibold{% else %}text-secondary hover:bg-surface-container-high{% endif %}">
                    <i data-lucide="network" class="w-5 h-5"></i>
                    <span>脚本节点</span>
                </a>
                <a hx-get="/files" hx-target="#main-content" hx-select="#page-content" hx-swap="innerHTML" hx-push-url="true" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm transition-colors cursor-pointer {% if active_nav == "files" %}bg-secondary-container text-on-secondary-container font-semibold{% else %}text-secondary hover:bg-surface-container-high{% endif %}">
                    <i data-lucide="folder-open" class="w-5 h-5"></i>
                    <span>文件</span>
                </a>
                <a hx-get="/users" hx-target="#main-content" hx-select="#page-content" hx-swap="innerHTML" hx-push-url="true" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm transition-colors cursor-pointer {% if active_nav == "users" %}bg-secondary-container text-on-secondary-container font-semibold{% else %}text-secondary hover:bg-surface-container-high{% endif %}">
                    <i data-lucide="users" class="w-5 h-5"></i>
                    <span>用户</span>
                </a>
                <a hx-get="/audit" hx-target="#main-content" hx-select="#page-content" hx-swap="innerHTML" hx-push-url="true" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm transition-colors cursor-pointer {% if active_nav == "audit" %}bg-secondary-container text-on-secondary-container font-semibold{% else %}text-secondary hover:bg-surface-container-high{% endif %}">
                    <i data-lucide="scroll-text" class="w-5 h-5"></i>
                    <span>审计</span>
                </a>
            </div>

            <div class="px-2 mt-auto pt-4 border-t border-outline-variant/30">
                <a href="/logout" class="w-full flex items-center gap-2 px-3 py-2 text-secondary hover:bg-surface-container-high transition-colors rounded-lg text-sm">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                    <span>退出登录</span>
                </a>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-w-0 bg-surface">
            <!-- Top Bar -->
            <header class="flex items-center justify-between px-6 h-16 w-full sticky top-0 z-30 bg-surface border-b border-outline-variant shrink-0">
                <div class="flex items-center gap-4">
                    <div class="text-xl font-bold text-primary">RFlow</div>
                </div>
                <div class="flex items-center gap-4">
                    <div id="cluster-status" hx-get="/cluster/status" hx-trigger="load, every 30s" hx-swap="innerHTML"></div>
                    <a href="/logout" class="text-sm text-secondary hover:text-on-surface transition-colors">退出</a>
                </div>
            </header>

            <div id="main-content" class="flex-1 flex flex-col min-h-0 overflow-hidden">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons();
        document.body.addEventListener('htmx:afterSwap', function() { lucide.createIcons(); });
        window.openEditDialog = async function(id, name, scriptPath) {
            const dialog = document.getElementById('edit-node-dialog');
            if (!dialog) return;

            const form = dialog.querySelector('form');
            form.setAttribute('hx-put', '/pipelines/' + id);
            htmx.process(form);
            form.querySelector('input[name="name"]').value = name;

            const select = document.getElementById('edit-script-select');
            select.innerHTML = '<option value="">加载中...</option>';
            const res = await fetch('/pipelines/scripts');
            const scripts = await res.json();
            select.innerHTML = '';
            scripts.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.path;
                opt.textContent = s.title ? `${s.filename} - ${s.title}` : s.filename;
                if (s.path === scriptPath) opt.selected = true;
                select.appendChild(opt);
            });

            dialog.showModal();
        };
        document.body.addEventListener('click', function(event) {
            const button = event.target.closest('[data-edit-node]');
            if (!button) return;
            window.openEditDialog(button.dataset.nodeId, button.dataset.nodeName, button.dataset.scriptPath);
        });
        document.body.addEventListener('htmx:afterOnLoad', function(e) {
            const link = e.detail.elt;
            if (link.closest('nav') && link.hasAttribute('hx-push-url')) {
                link.closest('nav').querySelectorAll('[hx-push-url]').forEach(a => {
                    a.className = a.className.replace(/bg-secondary-container text-on-secondary-container font-semibold/g, 'text-secondary hover:bg-surface-container-high');
                });
                link.className = link.className.replace(/text-secondary hover:bg-surface-container-high/g, 'bg-secondary-container text-on-secondary-container font-semibold');
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
