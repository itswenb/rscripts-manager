{% for node in nodes %}
<div id="node-{{ node.id }}" class="bg-surface-container-lowest border border-border rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-[0_1px_2px_rgba(0,0,0,0.05)]">
    <div class="flex-1">
        <div class="flex items-center gap-2 mb-1">
            <h3 class="text-base font-semibold text-on-surface">{{ node.name }}</h3>
            <span class="px-2 py-0.5 bg-success/20 text-success rounded text-[10px] font-bold uppercase tracking-wider">已注册</span>
        </div>
        <div class="font-mono text-xs text-secondary">{{ node.script_path }}</div>
        <div class="flex items-center gap-4 mt-2 text-xs text-muted-text">
            <span class="flex items-center gap-1"><i data-lucide="log-in" class="w-3 h-3"></i> {{ node.input_count }} 输入</span>
            <span class="flex items-center gap-1"><i data-lucide="log-out" class="w-3 h-3"></i> {{ node.output_count }} 输出</span>
        </div>
    </div>
    <div class="flex items-center gap-2">
        <button type="button" data-edit-node data-node-id="{{ node.id }}" data-node-name="{{ node.name }}" data-script-path="{{ node.script_path }}"
            class="px-3 py-1.5 text-sm border border-outline-variant rounded-lg text-secondary hover:text-primary hover:border-primary transition-colors">
            编辑
        </button>
        <button hx-delete="/pipelines/{{ node.id }}" hx-target="#node-{{ node.id }}" hx-swap="outerHTML swap:200ms" hx-confirm="确定删除节点「{{ node.name }}」？"
            class="px-3 py-1.5 text-sm border border-outline-variant rounded-lg text-secondary hover:text-destructive hover:border-destructive transition-colors">
            删除
        </button>
    </div>
</div>
{% endfor %}

{% if nodes.is_empty() %}
<div class="text-center py-12 text-muted-text">
    <i data-lucide="network" class="w-12 h-12 mx-auto mb-4 opacity-50"></i>
    <p class="text-lg font-medium">暂无脚本节点</p>
    <p class="text-sm mt-1">添加 R 脚本来创建节点</p>
</div>
{% endif %}
