{% for project in projects %}
<div id="project-{{ project.id }}" class="bg-surface-container-lowest border border-border rounded-xl p-4 flex flex-col gap-2 hover:shadow-[0_2px_8px_rgba(0,0,0,0.04)] transition-shadow group">
    <div class="flex justify-between items-start mb-2">
        <span class="font-mono text-xs text-muted-text bg-surface-container px-1.5 py-0.5 rounded">{{ project.id|truncate(8) }}</span>
        <button hx-delete="/projects/{{ project.id }}" hx-target="#project-{{ project.id }}" hx-swap="outerHTML swap:200ms" hx-confirm="确定删除项目「{{ project.name }}」？"
            class="text-muted-text hover:text-destructive transition-colors opacity-0 group-hover:opacity-100">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
    </div>
    <a href="/projects/{{ project.id }}" class="flex-1">
        <h3 class="text-lg font-semibold text-on-surface group-hover:text-primary transition-colors leading-snug">{{ project.name }}</h3>
        <p class="text-sm text-secondary line-clamp-2 mt-1">{{ project.description }}</p>
    </a>
    <div class="mt-auto pt-4 border-t border-border flex items-center text-muted-text text-sm">
        <i data-lucide="folder" class="w-4 h-4 mr-1.5"></i>
        {{ project.created_at }}
    </div>
</div>
{% endfor %}

{% if projects.is_empty() %}
<div class="col-span-full text-center py-12 text-muted-text">
    <i data-lucide="folder-open" class="w-12 h-12 mx-auto mb-4 opacity-50"></i>
    <p class="text-lg font-medium">暂无项目</p>
    <p class="text-sm mt-1">点击"新建项目"开始</p>
</div>
{% endif %}
