[alias]
pkg-all = "run --quiet --manifest-path xtask/Cargo.toml -- pkg-all"
pkg-linux-x86_64 = "run --quiet --manifest-path xtask/Cargo.toml -- pkg-linux-x86_64"
pkg-macos-aarch64 = "run --quiet --manifest-path xtask/Cargo.toml -- pkg-macos-aarch64"
pkg-windows-x86_64 = "run --quiet --manifest-path xtask/Cargo.toml -- pkg-windows-x86_64"

[target.'cfg(unix)']
runner = "./scripts/cargo-runner.sh"
